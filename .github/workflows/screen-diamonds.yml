name: Screen Oval Diamonds

on:
  workflow_dispatch:
  push:
    paths:
      - "screen-request.json"

permissions:
  contents: write

jobs:
  screen-diamonds:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: cmd
        run: |
          if not exist node_modules\playwright\package.json (
            npm install --no-audit --no-fund
          ) else (
            echo Dependencies already installed
          )

      - name: Screen Diamonds Factory inventory
        run: node screen-diamonds.mjs

      - name: Upload screening debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-screen-debug
          path: |
            screen-results.json
            screen-debug-attributes.json
            screen-debug-page.html
            screen-debug-text.txt
            screen-lazyload-request.txt
            screen-lazyload-response.txt
            screen-success.png
            screen-failure.png
          if-no-files-found: ignore

      - name: Save screening result
        if: always()
        shell: cmd
        run: |
          git config user.name "diamond-price-bot"
          git config user.email "diamond-price-bot@users.noreply.github.com"

          git add screen-results.json

          git diff --cached --quiet
          if %ERRORLEVEL% EQU 0 (
            echo No changes
          ) else (
            git commit -m "Update diamond screening results"
            git push
          )
