name: Check Diamond Price

on:
  workflow_dispatch:

  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  check-price:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Diamonds Factory price
        env:
          DIAMOND_CODE: LG789634401
        run: node check-price.mjs

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-debug
          path: |
            debug-response.txt
            price.json
          if-no-files-found: ignore

      - name: Save latest result
        if: always()
        run: |
          git config user.name "diamond-price-bot"
          git config user.email "diamond-price-bot@users.noreply.github.com"

          git add price.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update diamond price"
            git push
          fi
