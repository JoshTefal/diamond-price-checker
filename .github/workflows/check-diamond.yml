name: Check Diamond Price

on:
  workflow_dispatch:

  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  check-price:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Check Diamonds Factory price
        env:
          DIAMOND_CODE: LG602302388
        run: node check-price.mjs

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-debug
          path: |
            debug-response.txt
            debug-search-request.txt
            debug-dom.json
            price.json
            blocked-page.png
            failure-screenshot.png
            successful-check.png
          if-no-files-found: ignore

      - name: Save latest result
        if: always()
        shell: cmd
        run: |
          git config user.name "diamond-price-bot"
          git config user.email "diamond-price-bot@users.noreply.github.com"

          git add price.json

          git diff --cached --quiet
          if %ERRORLEVEL% EQU 0 (
            echo No changes
          ) else (
            git commit -m "Update diamond price"
            git push
          )
